name: OrangeHRM tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ORANGEHRM_URL: https://opensource-demo.orangehrmlive.com/web/index.php/auth/login
      ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install pytest-playwright python-dotenv
          python -m playwright install --with-deps chromium

      - name: Create authenticated state
        run: python auth_setup.py

      - name: Run tests
        run: python -m pytest test_orangehrm_authenticated.py
